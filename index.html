<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RoLeT|701</title>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050609;color:#fff;font-family:Tahoma,Arial,sans-serif}
.screen{position:fixed;inset:0;display:none}.screen.active{display:flex}
#menu{align-items:center;justify-content:center;background:radial-gradient(circle at 50% 25%,#ff334926,transparent 35%),#050609}
.panel,.lobbyPanel{background:#090d14eb;border:1px solid #ffffff18;border-radius:24px;box-shadow:0 25px 80px #000;backdrop-filter:blur(14px)}
.panel{width:min(92vw,430px);padding:28px;text-align:center}.logo{font-size:54px;font-weight:900;letter-spacing:8px;text-shadow:0 0 24px #f33}.sub{color:#aab2bf;margin:8px 0 25px}
.input{width:100%;padding:14px 16px;margin-bottom:12px;border-radius:14px;border:1px solid #29313e;background:#0b1018;color:#fff;outline:0}
.btn{width:100%;padding:14px;border:0;border-radius:14px;margin-top:9px;color:#fff;font-weight:800;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .12s,filter .12s,box-shadow .12s}.btn:hover{filter:brightness(1.12);box-shadow:0 8px 24px #0008}.btn:active{transform:scale(.98)}.primary{background:linear-gradient(135deg,#13d477,#08a95d)}.secondary{background:linear-gradient(135deg,#347cff,#2053c7)}.dark{background:#171e29;border:1px solid #ffffff18}.hidden{display:none!important}
#lobby{align-items:center;justify-content:center;background:radial-gradient(circle,#121823,#050609 65%)}.lobbyPanel{width:min(94vw,650px);padding:24px}.roomTop{display:flex;justify-content:space-between;align-items:center;gap:12px}.roomCode{font-size:28px;font-weight:900;letter-spacing:4px;color:#ffd65a}.copy{width:auto;padding:9px 13px;margin:0}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:20px 0}.playerRow{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:#0e141d;border:1px solid #ffffff12}.cubeIcon{width:27px;height:27px;border-radius:6px;background:var(--c,#fff)}.host{margin-right:auto;color:#ffd65a;font-size:12px}
#game{background:#000}#three{position:absolute;inset:0;overflow:hidden}#babylonCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;inset:0;pointer-events:none}.topHud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.hudBox{background:#05080dc2;border:1px solid #ffffff18;border-radius:14px;padding:10px 14px;backdrop-filter:blur(10px)}.bullets{font-size:20px;font-weight:900}.bullets small{font-size:11px;color:#aab2bf;font-weight:500}#roomBadge{position:absolute;top:67px;right:12px}
.turnBox{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);min-width:min(88vw,420px);text-align:center;padding:13px 18px;border-radius:16px;background:#05080ddd;border:1px solid #ffffff18}.turnBox.myTurn{border-color:#438cff99}.hint{font-size:12px;color:#aab2bf;margin-top:5px}
#countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:min(20vw,130px);font-weight:900;text-shadow:0 0 35px #fff;opacity:0;transition:.1s;z-index:8}#countdown.show{opacity:1}
#message{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;backdrop-filter:blur(5px);z-index:20}.messageCard{width:min(90vw,420px);padding:30px;text-align:center;border-radius:24px;background:#0b1018;border:1px solid #ffffff18}.messageCard h1{margin:0 0 10px;font-size:38px}.messageCard p{color:#aab2bf}
#toast{position:fixed;z-index:50;left:50%;top:18px;transform:translate(-50%,-140%);padding:11px 16px;border-radius:12px;background:#171d27;border:1px solid #ffffff18;transition:.25s}#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<section id="menu" class="screen active"><div class="panel">
<div class="logo">RoLeT701</div>
<input id="nameInput" class="input" maxlength="20" placeholder="بنویس یور فاکینگ اسمتو">
<button id="createBtn" class="btn primary">ساخت اتاق بازی</button>
<button id="showJoinBtn" class="btn secondary">ورود به اتاق دیگران برای بازی</button>
<div id="joinBox" class="hidden"><input id="codeInput" class="input" maxlength="6" placeholder="گد اتاق مد نظرو بتایپ" style="margin-top:12px;text-transform:uppercase"><button id="joinBtn" class="btn primary">ورود به اتاق</button></div>
</div></section>

<section id="lobby" class="screen"><div class="lobbyPanel">
<div class="roomTop"><div><div style="color:#aab2bf;font-size:12px">کد اتاق</div><div id="roomCode" class="roomCode">------</div></div><button id="copyBtn" class="btn dark copy">کپی کد</button></div>
<div id="players" class="players"></div><div id="lobbyInfo" style="text-align:center;color:#aab2bf;margin:12px">حداقل ۲ بازیکن لازم است.</div>
<button id="startBtn" class="btn primary">شروع بازی</button><button id="leaveBtn" class="btn dark">خروج</button>
</div></section>

<section id="game" class="screen"><div id="three"></div><div id="countdown"></div><div id="hud">
<div class="topHud"><div class="hudBox bullets"><span id="bulletCount">0/0</span> 🔫 <small>تیر</small></div><div class="hudBox"><span id="roundText">راند ۱</span></div></div>
<div id="roomBadge" class="hudBox">اتاق: <b id="gameRoomCode">------</b></div>
<div id="turnBox" class="turnBox"><b id="turnText">در حال آماده‌سازی...</b><div id="hint" class="hint">دوربین را با موس یا لمس بچرخان.</div></div>
</div></section>
<div id="message" class="hidden"><div class="messageCard"><h1 id="messageTitle">🏆 برنده</h1><p id="messageText"></p></div></div><div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const menu=$("menu"), lobby=$("lobby"), game=$("game");

let ws=null,myId=null,roomCode=null,roomState=null;
let engine=null,scene=null,camera=null,arena=null,gun=null,ray=null;
let shotBusy=false;
const meshes=new Map();
const colors=[
  "#ffffff","#ffc24b","#45a3ff","#39dc79","#ff63c8","#b57cff",
  "#ff7043","#72e3df","#f28c28","#6b8cff","#95e64b","#ff6688"
];

function screen(s){
  [menu,lobby,game].forEach(x=>x.classList.remove("active"));
  s.classList.add("active");
}
function toast(t){
  const x=$("toast");
  x.textContent=t;
  x.classList.add("show");
  clearTimeout(x.t);
  x.t=setTimeout(()=>x.classList.remove("show"),2200);
}
function send(d){
  if(!ws || ws.readyState!==WebSocket.OPEN){
    toast("اتصال به سرور برقرار نیست.");
    return false;
  }
  ws.send(JSON.stringify(d));
  return true;
}
function connect(){
  if(ws && (ws.readyState===WebSocket.OPEN || ws.readyState===WebSocket.CONNECTING)) return ws;
  const proto=location.protocol==="https:" ? "wss:" : "ws:";
  ws=new WebSocket(proto+"//"+location.host);
  ws.onopen=()=>{
    if(ws._pending){
      const p=ws._pending;
      ws._pending=null;
      send(p);
    }
  };
  ws.onclose=()=>toast("اتصال به سرور قطع شد.");
  ws.onerror=()=>toast("خطا در اتصال به سرور.");
  ws.onmessage=e=>{
    try{ handle(JSON.parse(e.data)); }
    catch{ toast("پاسخ نامعتبر از سرور."); }
  };
  return ws;
}
function connectThen(d){
  const socket=connect();
  if(socket.readyState===WebSocket.OPEN) send(d);
  else socket._pending=d;
}

$("createBtn").onclick=()=>{
  const n=$("nameInput").value.trim();
  if(!n) return toast("نامت را وارد کن.");
  connectThen({type:"createRoom",name:n.slice(0,20)});
};
$("showJoinBtn").onclick=()=>$("joinBox").classList.toggle("hidden");
$("joinBtn").onclick=()=>{
  const n=$("nameInput").value.trim();
  const c=$("codeInput").value.trim().toUpperCase();
  if(!n) return toast("نامت را وارد کن.");
  if(c.length!==6) return toast("کد اتاق باید ۶ کاراکتر باشد.");
  connectThen({type:"joinRoom",name:n.slice(0,20),code:c});
};
$("codeInput").oninput=()=>$("codeInput").value=
  $("codeInput").value.replace(/[^a-z0-9]/gi,"").toUpperCase().slice(0,6);
$("copyBtn").onclick=async()=>{
  try{ await navigator.clipboard.writeText(roomCode); toast("کد کپی شد."); }
  catch{ toast(roomCode); }
};
$("leaveBtn").onclick=()=>{
  ws?.close(); ws=null; roomState=null; myId=null; roomCode=null;
  screen(menu);
};
$("startBtn").onclick=()=>send({type:"startGame"});

function handle(m){
  if(m.type==="roomCreated" || m.type==="roomJoined"){
    myId=m.playerId;
    roomCode=m.roomCode;
    $("roomCode").textContent=roomCode;
    $("gameRoomCode").textContent=roomCode;
    screen(lobby);
    return;
  }
  if(m.type==="roomState"){
    roomState=m.room;
    roomCode=m.room.code;
    $("roomCode").textContent=roomCode;
    $("gameRoomCode").textContent=roomCode;
    updateLobby();
    updateHud();
    return;
  }
  if(m.type==="gameStarted"){
    screen(game);
    init3D();
    updateHud();
    return;
  }
  if(m.type==="shot"){
    shotBusy=false;
    shotEffect(m.targetId,Boolean(m.isBullet));
    return;
  }
  if(m.type==="newRound"){
    shotBusy=false;
    reloadEffect();
    updateHud();
    return;
  }
  if(m.type==="nextTurn"){
    shotBusy=false;
    updateHud();
    return;
  }
  if(m.type==="gameOver"){
    shotBusy=false;
    showWinner(m.winner);
    return;
  }
  if(m.type==="returnToLobby"){
    $("message").classList.add("hidden");
    screen(lobby);
    updateLobby();
    return;
  }
  if(m.type==="error"){
    const errors={
      NAME_REQUIRED:"نام را وارد کن.",
      ROOM_CODE_REQUIRED:"کد اتاق را وارد کن.",
      ROOM_NOT_FOUND:"اتاق پیدا نشد.",
      ROOM_FULL:"اتاق پر است.",
      GAME_ALREADY_STARTED:"بازی شروع شده.",
      NOT_ENOUGH_PLAYERS:"حداقل ۲ بازیکن لازم است.",
      ONLY_HOST_CAN_START:"فقط میزبان می‌تواند بازی را شروع کند.",
      NOT_YOUR_TURN:"الان نوبت تو نیست.",
      PLAYER_DEAD:"این بازیکن حذف شده است.",
      NO_BULLETS:"تیرهای این راند تمام شده‌اند.",
      GAME_NOT_STARTED:"بازی هنوز شروع نشده است.",
      PLAYER_NOT_FOUND:"بازیکن پیدا نشد.",
      ALREADY_IN_ROOM:"تو از قبل داخل یک اتاق هستی."
    };
    toast(errors[m.error] || "خطایی رخ داد.");
  }
}

function updateLobby(){
  if(!roomState) return;
  const el=$("players");
  el.innerHTML="";
  roomState.players.forEach((p,i)=>{
    const d=document.createElement("div");
    d.className="playerRow";
    d.innerHTML=
      `<span class="cubeIcon" style="--c:${colors[i%colors.length]}"></span>`+
      `<b>${esc(p.name)}</b>`+
      (p.isHost?'<span class="host">👑 میزبان</span>':"");
    el.appendChild(d);
  });
  $("startBtn").classList.toggle("hidden",myId!==roomState.hostId);
  $("lobbyInfo").textContent=roomState.players.length<2
    ?"حداقل ۲ بازیکن لازم است."
    :`${roomState.players.length} بازیکن آماده‌اند.`;
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
function updateHud(){
  if(!roomState) return;
  $("bulletCount").textContent=
    `${roomState.remainingBullets}/${roomState.bullets}`;
  $("roundText").textContent=`راند ${Math.max(1,roomState.round||1)}`;
  const p=roomState.players.find(x=>x.id===roomState.currentPlayerId);
  if(p?.id===myId){
    $("turnText").textContent="نوبت توست 🔫";
    $("turnBox").classList.add("myTurn");
    $("hint").textContent="روی خودت یا یک بازیکن زنده بزن تا شلیک کنی.";
  }else{
    $("turnText").textContent=p?`نوبت ${p.name} است`:"منتظر نوبت...";
    $("turnBox").classList.remove("myTurn");
    $("hint").textContent="دوربین را با موس یا لمس بچرخان.";
  }
  syncPlayers();
}

/* ---------------- Babylon.js 3D ---------------- */

function init3D(){
  if(engine) return;

  const canvas=document.createElement("canvas");
  canvas.id="babylonCanvas";
  canvas.style.cssText="position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;";
  $("three").appendChild(canvas);

  engine=new BABYLON.Engine(canvas,true,{
    antialias:true,
    preserveDrawingBuffer:false,
    stencil:true
  });

  scene=new BABYLON.Scene(engine);
  scene.clearColor=new BABYLON.Color4(0.02,0.025,0.027,1);
  scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity=.035;
  scene.fogColor=new BABYLON.Color3(.02,.025,.027);

  camera=new BABYLON.ArcRotateCamera(
    "camera",-Math.PI/2.2,1.05,14,
    new BABYLON.Vector3(0,1.8,0),scene
  );
  camera.lowerRadiusLimit=8;
  camera.upperRadiusLimit=18;
  camera.lowerBetaLimit=.45;
  camera.upperBetaLimit=1.45;
  camera.wheelPrecision=70;
  camera.pinchPrecision=80;
  camera.panningSensibility=0;
  camera.attachControl(canvas,true);

  const hemi=new BABYLON.HemisphericLight(
    "hemi",new BABYLON.Vector3(0,1,0),scene
  );
  hemi.intensity=.7;
  hemi.diffuse=new BABYLON.Color3(.65,.7,.8);
  hemi.groundColor=new BABYLON.Color3(.08,.05,.03);

  const point=new BABYLON.PointLight(
    "warm",new BABYLON.Vector3(0,7,0),scene
  );
  point.diffuse=new BABYLON.Color3(1,.75,.45);
  point.intensity=35;
  point.range=16;

  const blue=new BABYLON.PointLight(
    "blue",new BABYLON.Vector3(-7,3,5),scene
  );
  blue.diffuse=new BABYLON.Color3(.25,.4,1);
  blue.intensity=8;
  blue.range=20;

  createRoom();
  engine.runRenderLoop(()=>scene.render());

  window.addEventListener("resize",()=>engine?.resize());
  canvas.addEventListener("pointerup",tap);
}

function mat(name,color,rough=.8,metal=0){
  const m=new BABYLON.StandardMaterial(name,scene);
  m.diffuseColor=BABYLON.Color3.FromHexString(color);
  m.specularColor=new BABYLON.Color3(.18,.18,.18);
  m.roughness=rough;
  m.metallic=metal;
  return m;
}

function createRoom(){
  arena=new BABYLON.TransformNode("arena",scene);

  const floor=BABYLON.MeshBuilder.CreateCylinder(
    "floor",{diameter:20,height:.35,tessellation:48},scene
  );
  floor.position.y=-.2;
  floor.material=mat("floorMat","#24201c",.95);
  floor.parent=arena;

  const rug=BABYLON.MeshBuilder.CreateCylinder(
    "rug",{diameter:14.8,height:.04,tessellation:48},scene
  );
  rug.position.y=.01;
  rug.material=mat("rugMat","#111417",1);
  rug.parent=arena;

  for(let i=0;i<12;i++){
    const a=i*Math.PI*2/12;
    const w=BABYLON.MeshBuilder.CreateBox(
      "wall"+i,{width:1.8,height:5,depth:.45},scene
    );
    w.position.set(Math.cos(a)*10,2.3,Math.sin(a)*10);
    w.rotation.y=-a;
    w.material=mat("wallMat"+i,"#15191d",1);
    w.parent=arena;
  }

  const center=BABYLON.MeshBuilder.CreateCylinder(
    "center",{diameterTop:2.7,diameterBottom:3,height:.7,tessellation:8},scene
  );
  center.position.y=.35;
  center.material=mat("centerMat","#30261d",.8);
  center.parent=arena;

  gun=makeGun();
  gun.position.set(0,1.1,0);
  gun.rotation.y=Math.PI;
  gun.parent=arena;
}

function makeGun(){
  const g=new BABYLON.TransformNode("gun",scene);

  const body=BABYLON.MeshBuilder.CreateBox(
    "gunBody",{width:2.1,height:.55,depth:.8},scene
  );
  body.material=mat("gunBodyMat","#252a31",.3,.65);
  body.parent=g;

  const bar=BABYLON.MeshBuilder.CreateCylinder(
    "barrel",{diameter:.38,height:2.4,tessellation:16},scene
  );
  bar.rotation.z=Math.PI/2;
  bar.position.x=2.05;
  bar.material=mat("barrelMat","#11151a",.2,.8);
  bar.parent=g;

  const grip=BABYLON.MeshBuilder.CreateBox(
    "grip",{width:.48,height:1.2,depth:.55},scene
  );
  grip.position.set(-.45,-.72,0);
  grip.rotation.z=-.12;
  grip.material=mat("gripMat","#16191e",.8);
  grip.parent=g;

  return g;
}

function player(p,i){
  const g=new BABYLON.TransformNode("player_"+p.id,scene);
  g.metadata={id:p.id};

  const body=BABYLON.MeshBuilder.CreateBox(
    "body",{width:1.15,height:1.55,depth:1.15},scene
  );
  body.position.y=1.35;
  body.material=mat("body_"+p.id,colors[i%colors.length],.7);
  body.parent=g;

  const head=BABYLON.MeshBuilder.CreateBox(
    "head",{width:.92,height:.92,depth:.92},scene
  );
  head.position.y=2.55;
  head.material=mat("head_"+p.id,"#e7e7e7",.75);
  head.parent=g;

  const seat=BABYLON.MeshBuilder.CreateBox(
    "seat",{width:1.65,height:.55,depth:1.65},scene
  );
  seat.position.y=.3;
  seat.material=mat("seat_"+p.id,"#24282d",.8);
  seat.parent=g;

  const label=makeLabel(p.name);
  label.position.y=3.45;
  label.parent=g;

  g.metadata.body=body;
  return g;
}

function makeLabel(text){
  const plane=BABYLON.MeshBuilder.CreatePlane(
    "label",{width:3.2,height:.8},scene
  );
  plane.billboardMode=BABYLON.Mesh.BILLBOARDMODE_ALL;

  const tex=new BABYLON.DynamicTexture(
    "labelTex_"+Math.random(),{width:512,height:128},scene,true
  );
  tex.hasAlpha=true;
  const ctx=tex.getContext();
  ctx.clearRect(0,0,512,128);
  ctx.font="bold 46px Tahoma, Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.lineWidth=10;
  ctx.strokeStyle="#000000";
  ctx.fillStyle="#ffffff";
  ctx.strokeText(String(text),256,64);
  ctx.fillText(String(text),256,64);
  tex.update();

  const m=new BABYLON.StandardMaterial("labelMat_"+Math.random(),scene);
  m.diffuseTexture=tex;
  m.opacityTexture=tex;
  m.emissiveColor=new BABYLON.Color3(1,1,1);
  m.disableLighting=true;
  plane.material=m;
  return plane;
}

function syncPlayers(){
  if(!arena || !roomState) return;
  const n=Math.max(1,roomState.players.length);

  roomState.players.forEach((p,i)=>{
    let g=meshes.get(p.id);
    if(!g){
      g=player(p,i);
      meshes.set(p.id,g);
      g.parent=arena;
    }
    const a=i*Math.PI*2/n+Math.PI/2;
    g.position.set(Math.cos(a)*5.2,0,Math.sin(a)*5.2);
    g.rotation.y=Math.atan2(-g.position.x,-g.position.z);

    const body=g.metadata.body;
    body.material.diffuseColor=BABYLON.Color3.FromHexString(
      p.alive?colors[i%colors.length]:"#08090a"
    );
    body.visibility=p.alive?1:.5;
  });

  for(const [id,g] of meshes){
    g.setEnabled(roomState.players.some(p=>p.id===id));
  }
}

function tap(e){
  if(shotBusy || !roomState || roomState.currentPlayerId!==myId) return;
  const me=roomState.players.find(p=>p.id===myId);
  if(!me?.alive) return;

  const pick=scene.pick(
    scene.pointerX,
    scene.pointerY,
    mesh=>{
      let n=mesh;
      while(n){
        if(n.metadata?.id) return true;
        n=n.parent;
      }
      return false;
    }
  );

  if(!pick?.hit) return;

  let o=pick.pickedMesh;
  while(o && !o.metadata?.id) o=o.parent;
  const id=o?.metadata?.id;

  if(!id || !roomState.players.some(p=>p.id===id && p.alive)) return;

  shotBusy=true;
  showShotDelay(()=>send({type:"shoot",targetId:id}));
}

function showShotDelay(cb){
  const ms=250+Math.random()*750;
  const cd=$("countdown");
  cd.textContent="...";
  cd.classList.add("show");
  setTimeout(()=>{
    cd.textContent="🔫";
    setTimeout(()=>{
      cd.classList.remove("show");
      cb();
    },80);
  },ms);
}

function shotEffect(targetId,isBullet){
  const target=meshes.get(targetId);
  if(!target || !gun) return;

  const start=gun.getAbsolutePosition().add(new BABYLON.Vector3(2.7,0,0));
  const end=target.getAbsolutePosition().add(new BABYLON.Vector3(0,1.55,0));
  const color=isBullet
    ?new BABYLON.Color3(1,.1,.18)
    :new BABYLON.Color3(.2,1,.45);

  const line=BABYLON.MeshBuilder.CreateLines(
    "shotLine",{points:[start,end]},scene
  );
  line.color=color;

  const flash=BABYLON.MeshBuilder.CreateSphere(
    "flash",{diameter:.28,segments:14},scene
  );
  flash.position.copyFrom(start);
  const fm=new BABYLON.StandardMaterial("flashMat",scene);
  fm.emissiveColor=color;
  fm.disableLighting=true;
  flash.material=fm;

  const light=new BABYLON.PointLight("shotLight",start,scene);
  light.diffuse=color;
  light.intensity=14;
  light.range=5;

  const startTime=performance.now();
  function fx(now){
    const q=Math.min(1,(now-startTime)/550);
    line.visibility=1-q;
    flash.scaling.setAll(1+Math.sin(q*Math.PI));
    light.intensity=14*(1-q);
    if(q<1) requestAnimationFrame(fx);
    else{
      line.dispose();
      flash.dispose();
      light.dispose();
    }
  }
  requestAnimationFrame(fx);

  if(isBullet){
    target.scaling.set(1.12,.88,1.12);
    setTimeout(()=>target.scaling.set(1,1,1),180);
  }
}

function reloadEffect(){
  const cd=$("countdown");
  cd.textContent="راند بعدی";
  cd.classList.add("show");
  setTimeout(()=>cd.classList.remove("show"),650);
}

function showWinner(n){
  $("messageTitle").textContent="🏆 برنده";
  $("messageText").textContent=n?`${n} برنده بازی شد!`:"بازی تمام شد.";
  $("message").classList.remove("hidden");
  setTimeout(()=>$("message").classList.add("hidden"),9500);
}
</script>
